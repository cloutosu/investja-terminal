name: Scrape and deploy

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Scrape investja.org
        run: node scraper.js
        env:
          INVESTJA_USER: ${{ secrets.INVESTJA_USER }}
          INVESTJA_PASS: ${{ secrets.INVESTJA_PASS }}
          TARGET_TEAM: ${{ vars.VITE_TARGET_TEAM }}
          PREV_DATA: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
      - name: Build site
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_PIN: ${{ vars.VITE_PIN }}
          VITE_TARGET_TEAM: ${{ vars.VITE_TARGET_TEAM }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
